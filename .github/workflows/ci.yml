name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Demo (both layers catch a hardcode)
        run: python demo/run_demo.py
      - name: Harness plumbing (no model)
        shell: bash
        run: |
          FAKE_AGENT_MODE=hardcode python benchmark/harness.py \
            --agent-cmd python \
            --agent-arg "$(pwd)/benchmark/tools/fake_agent.py" \
            --states off,full --out benchmark/results/ci.json
          python - <<'PY'
          import json

          rows = json.load(open("benchmark/results/ci.json", encoding="utf-8"))
          caught = [r for r in rows
                    if r["outcome"] == "silent cheat" and "hardcoded-return" in r["greenwash_flags"]]
          assert caught, "plumbing run: the planted hardcode was no longer detected"
          print(f"plumbing: {len(caught)}/{len(rows)} hardcode runs classified as silent cheat")
          PY

  integrations:
    name: integrations (action + pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tooling
        run: python -m pip install --upgrade pip pre-commit
      - name: Plant a faked diff
        run: |
          printf '\n\n@pytest.mark.skip(reason="planted by the self-test")\ndef test_planted():\n    pass\n' >> tests/test_greenwash.py
      - name: GitHub Action (must fail)
        id: greenwash
        continue-on-error: true
        uses: ./
      - name: pre-commit hook (must fail)
        id: precommit
        continue-on-error: true
        run: |
          cat > .pre-commit-config.yaml <<'YAML'
          repos:
            - repo: local
              hooks:
                - id: greenwash
                  name: greenwash
                  entry: python scripts/greenwash_check.py scan --staged
                  language: system
                  pass_filenames: false
                  always_run: true
          YAML
          git add -A
          pre-commit run greenwash
      - name: Assert both caught the planted skip
        run: |
          test "${{ steps.greenwash.outcome }}" = "failure" || { echo "::error::the GitHub Action missed the planted @pytest.mark.skip"; exit 1; }
          test "${{ steps.precommit.outcome }}" = "failure" || { echo "::error::the pre-commit hook missed the planted @pytest.mark.skip"; exit 1; }
          echo "integrations: action and pre-commit both failed on the planted skip, as they should"
