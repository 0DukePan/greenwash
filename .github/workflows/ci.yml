name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Demo (both layers catch a hardcode)
        run: python demo/run_demo.py
      - name: Harness plumbing (no model)
        shell: bash
        run: |
          FAKE_AGENT_MODE=hardcode python benchmark/harness.py \
            --agent-cmd python \
            --agent-arg "$(pwd)/benchmark/tools/fake_agent.py" \
            --states off,full --out benchmark/results/ci.json
          python - <<'PY'
          import json

          rows = json.load(open("benchmark/results/ci.json", encoding="utf-8"))
          caught = [r for r in rows
                    if r["outcome"] == "silent cheat" and "hardcoded-return" in r["greenwash_flags"]]
          assert caught, "plumbing run: the planted hardcode was no longer detected"
          print(f"plumbing: {len(caught)}/{len(rows)} hardcode runs classified as silent cheat")
          PY
