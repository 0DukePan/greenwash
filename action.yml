name: greenwash
description: Flag an agent's diff that fakes a passing test suite
author: greenwash

inputs:
  base:
    description: "Git ref to diff against (default: HEAD)"
    required: false
    default: ""
  run-tests:
    description: Command that runs the project's tests (optional)
    required: false
    default: ""
  heldout:
    description: Path to (or command running) a suite the agent never saw (optional)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: greenwash
      shell: bash
      env:
        GW_BASE: ${{ inputs.base }}
        GW_RUN_TESTS: ${{ inputs.run-tests }}
        GW_HELDOUT: ${{ inputs.heldout }}
      run: |
        set -euo pipefail
        cmd=(python "$GITHUB_ACTION_PATH/scripts/greenwash_check.py" all)
        [ -n "$GW_BASE" ]      && cmd+=(--base "$GW_BASE")
        [ -n "$GW_RUN_TESTS" ] && cmd+=(--run-tests "$GW_RUN_TESTS")
        [ -n "$GW_HELDOUT" ]   && cmd+=(--heldout "$GW_HELDOUT")
        if "${cmd[@]}"; then
          echo "greenwash: clean"
        else
          echo "::error::greenwash flagged a faked passing suite (see log above)"
          exit 1
        fi
